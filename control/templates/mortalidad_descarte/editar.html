<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <form action="{% url 'editar_mortalidad' object.id %}" enctype="multipart/form-data" method="post">
            <div class="modal-header">
                {% load static %}
                <h3 class="modal-title">Editar registro mortalidad y/o descarte</h3>
                <img class="ml-3" src="{% static 'images/sena_logo.png' %}" alt="Logo Sena" style="width: 4rem">
            </div>
            <div class="modal-body">
                <div class="row">
                    {% include 'mortalidad_descarte/form.html' %}
                </div>
            </div>
            <div class="modal-footer text-center">
            <input class="btn btn-outline-success" type="submit" value="Enviar informacion">
            <a role="button" class="btn btn-outline-danger" onclick="cerrarModal();">Cancelar</a>
            </div>
        </form>
    </div>
  </div>
