<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            {% load static %}
            <h3 class="modal-title">Crear registro mortalidad y/o descarte</h3>
            <img class="ml-3" src="{% static 'images/sena_logo.png' %}" alt="Logo Sena" style="width: 4rem">
        </div>
        <form class="formCrear" action="{% url 'crear_mortalidad' %}" enctype="multipart/form-data" method="POST">
            <div class="modal-body">
                <div class="row">
                    {% include 'mortalidad_descarte/form.html' %}                    
                </div>
            </div>
            <div class="modal-footer text-center">
                <button class="btn btn-outline-success" type="button" onclick="registrar();">
                    Confirmar
                </button>
                <button type="button" class="btn btn-outline-danger" onclick="cerrarModalCrear();">
                    Cancelar
                </button>
            </div>
            <script src="{% static "Js/mortaDescar.js" %}"></script>
        </form>
    </div>
</div>
