<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            {% load static %}
            <h3 class="modal-title">Crear registro mortalidad y/o descarte</h3>
            <img class="ml-3" src="{% static 'images/sena_logo.png' %}" alt="Logo Sena" style="width: 4rem">
        </div>
        <form class="formCrear" action="{% url 'crear_mortalidad' %}" enctype="multipart/form-data" method="POST">
            <div class="modal-body">
                <div class="galpones">
                    <input type="hidden" value="" id="idGalpon">
                    {%for galpon in data%}
                    <input type="hidden" class="galpon" data-id="{{galpon.0}}" value="{{galpon.1}}">
                    {% endfor %}
                </div>
                <div class="row">
                    {% include 'mortalidad_descarte/form.html' %}                    
                </div>
                <script src="{% static "Js/mortaDescar.js" %}"></script>
            </div>
            <div class="modal-footer hidden-center">
                <button class="btn btn-outline-success" type="button" onclick="registrar();">Confirmar</button>
                <button type="button" class="btn btn-outline-danger" onclick="cerrarModalCrear();">Cancelar</button>
            </div>
        </form>
    </div>
  </div>
