{% csrf_token %}
<div class="row">
    {% for campo in form %}
        {% if campo.name == "area" %}
            <div class="col-6 mb-3">
                <label class="form-label">{{ campo.label }} mt2</label>
                <input
                    type="number"
                    onkeypress='return onlyNumber(event);'
                    type="{{campo.field.widget.input_type}}"
                    id="{{campo.name}}"
                    class="form-control {{campo.name}} readOnly"
                    name="{{ campo.name }}"
                    aria-describedby="helpId"
                    placeholder="{{ campo.label }}"
                    value="{{ campo.value }}"
                    readonly 
                />
                <div id="errores{{campo.name}}">
            
                </div>
            </div>
        {% else %}
            {% if campo.name == "capac_bebed" or campo.name == "capac_comed" or campo.name == "capac_gall" or campo.name == "capac_nidales"%}
                <div class="col-6 mb-3">
                    <label class="form-label">{{ campo.label }}</label>
                    <input
                        type="number"
                        id="{{campo.name}}"
                        class="form-control {{campo.name}} readOnly"
                        name="{{ campo.name }}"
                        aria-describedby="helpId"
                        placeholder="{{ campo.label }}"
                        value="{{ campo.value | default:''}}"
                        readonly
                    />
                    <div id="errores{{campo.name}}">
                
                    </div>
                </div>
            {% else %}
                <div class="col-6 mb-3">
                    <label class="form-label">{{ campo.label }}</label>
                    <input
                        {% if campo.name == "ancho" or campo.name == "largo" %}onInput="calcuateArea();"{% endif %}
                        type="{{campo.field.widget.input_type}}"
                        id="{{campo.name}}"
                        class="form-control {{campo.name}}"
                        name="{{ campo.name }}"
                        aria-describedby="helpId"
                        placeholder="{{ campo.label }}"
                        value="{{ campo.value | default:''}}"
                        {% if campo.name != "nombre_galpon" %}min="1" max="900" step="1" onkeypress="return onlyNumber(event);"{% endif %}
                    />
                    <div id="errores{{campo.name}}">
                
                    </div>
                </div>
            {% endif %}
        {% endif %}
    {% endfor %}
</div>
