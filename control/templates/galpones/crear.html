<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <form class="formCrear" class="formulario" action="{% url 'crear_galpon' %}" enctype="multipart/form-data" method="POST">
      <div class="modal-header">
        {% load static %}
        <h3 class="modal-title">Registrar galpón</h3>
        <img class="ml-3" src="{% static 'images/sena_logo.png' %}" alt="Logo Sena" style="width: 4rem">
      </div>
      <div class="modal-body">
        {% include 'galpones/form.html' %}
      </div>
      <div class="modal-footer text-center">
        <button class="btn btn-outline-success" type="button" onclick="registrar();">Confirmar</button>
        <button type="button" class="btn btn-outline-danger" onclick="cerrarModalCrear();">Cancelar</button>
      </div>
    </form>
  </div>
</div>
