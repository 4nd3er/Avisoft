{% extends 'base.html' %}
{% load static %}

{% block titulo %}
  Rol
{% endblock %}

{% block contenido %}
  {% load static %}

  <div class="col-md my-4 py-2 text-center title" style="border: 2px solid var(--colorsec2); color: var(--colorsec2);">
    <h3>ROL</h3>
  </div>

  <div class="row mt-3 mb-3 container-fluid mx-auto" style="gap: 20px;">
    <div class="col-md" style="border: 1px solid;border-radius: .5rem;">
      <form>
        <div class="row text-center" style="margin: 2rem 0; align-items: center;">
          <div class="col-md col-sm">
            <Select class="form-selected p-2" style="border-radius: .5rem;">
              <option selected value="1">Seleccione el galpón</option>
              <option value="1">Galpón 1</option>
              <option value="2">Galpón 2</option>
              <option value="3">Galpón 3</option>
              <option value="4">Galpón 4</option>
            </Select>
          </div>
        </div>
      </form>
    </div>

    <div class="col-md" style="border: 1px solid; border-top-right-radius: .5rem; border-radius: .5rem;">
      <div class="row text-center" style="margin: 2rem 0;">
        <div class="col-md col-sm">
          <button class="btn btn-outline-secondary my-3" style="border: 2px solid" onclick="abrirModalCrear('{% url 'crear_rol' %}')" role="button">
            REGISTRAR <i class="bi bi-plus-circle"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="mb-3 container-fluid card" style="height: 20rem; border: 1px solid; border-radius: .5rem;width: 97%;">
    <div class="table-responsive">
        <table class="table text-center">
            {% if rol %}
            <thead>
                <tr>
                    <th scope="col">Rol</th>
                    <th scope="col">Acciones</th>
                </tr>
            </thead>
            <tbody>
              {% for dato in rol %}
                  <tr class="text-center">
                      <td>{{ dato.tipo_rol }}</td>
                      <td colspan="2">
                        <button class="btn btn-outline-success my-1" onclick="abrirModalEditar('{% url 'editar_rol' dato.id %}')" role="button">Editar</button>
                        |
                        <button class="btn btn-outline-danger my-1" onclick="abrirModalEliminar('{% url 'confirmElimRol' dato.id %}')" role="button">Eliminar</button>
                      </td>
                  </tr>
              {% endfor %}
            </tbody>
            {% else %}
            <tbody class="text-center mx-auto">
                <h1>No hay datos registrados</h1>
            </tbody>
            {% endif %}
        </table>
    </div>
  </div>

  <div class="row container-fluid">
    <div class="col-md col-sm">
      <a class="btn btn-outline-secondary" style="border: 2px solid">EXPORTAR <i class="bi bi-file-earmark-arrow-down"></i></a>
    </div>
  </div>

  <div class="modal fade" id="crear" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">

  </div>

  <div class="modal fade" id="editar" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">

  </div>

  <div class="modal fade" id="eliminar" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">

  </div>
{% endblock %}
