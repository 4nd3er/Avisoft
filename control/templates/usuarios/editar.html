<div class="modal-dialog modal-dialog-centered">
   <div class="modal-content">
      <div class="modal-header">
         {% load static %}
         <h3 class="modal-title">Editar Usuario {{object.nombre}}</h3>
         <img class="ml-3" src="{% static 'images/sena_logo.png' %}" alt="Logo Sena" style="width: 4rem">
      </div>
      <form class="formEditar" action="{% url 'editar_usuario' object.id %}" enctype="multipart/form-data" method="POST">
         {% include 'usuarios/form.html' %}
         <div class="modal-footer text-center">
            <button type="button" class="btn btn-outline-success" onclick="editar();">
               Confirmar
            </button>
            <button type="button" class="btn btn-outline-danger" onclick="cerrarModalEditar();">
               Cancelar
            </button>
         </div>
      </form>
   </div>
</div>
