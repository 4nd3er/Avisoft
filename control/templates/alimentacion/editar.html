<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            {% load static %}
            <h3 class="modal-title">Editar Alimentación</h3>
            <img class="ml-3" src="{% static 'images/sena_logo.png' %}" alt="Logo Sena" style="width: 4rem">
        </div>
        <form class="formEditar" action="{% url 'editar_alimentacion' object.id %}" enctype="multipart/form-data" method="POST">
            {% include "alimentacion/form.html" %}
            <div class="modal-footer text-center">
                <button class="btn btn-outline-success" type="button" onclick="editar();">Confirmar</button>
                <button type="button" class="btn btn-outline-danger" onclick="cerrarModalEditar();">Cancelar</button>
            </div>
      </form>
    </div>
</div>
