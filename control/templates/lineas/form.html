<div class="modal-body">
    {% csrf_token %}
    {% for campo in form %}
        <div class="mb-3">
            <label class="form-label">{{ campo.label }}</label>
            <input
                type="{{campo.field.widget.input_type}}"
                class="form-control"
                name="{{campo.name}}"
                aria-describedby="helpId"
                placeholder="Digite el nombre de la linea"
                value="{{ campo.value | default:"" }}"
            />
        </div>
        <div id="errores{{campo.name}}">

        </div>
    {% endfor %}
</div>
